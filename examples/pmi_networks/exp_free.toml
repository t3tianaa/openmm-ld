# Network E (exploration), FREE leg: the PMI-N8A peptide alone in water.
# Three sites, 2 x 3 x 2 = 12 states, substitutions taken from the PMI-M3/M5 series:
#   site 1 = position 8   WT ALA (the background is PMI-N8A) -> ASN, which restores wild-type PMI
#   site 2 = position 9   WT LEU -> GLN, MET
#   site 3 = position 11  WT SER -> MET
# The corner ALA8 + GLN9 + MET11 is TSFAEYWAQLMP, which carries PMI-M3's 8-11 motif (A Q L M) on the
# plain PMI backbone. M3 itself is LTFLEYWAQLMQ at 3.7 pM, so that motif is known to be worth having;
# this network asks how much of it survives without M3's T1L, S2T, A4L and P12Q.
# Only two states have a measured Kd on this background, so read this network as design, not validation;
# network V is the validation run. See networks.md.
# Amber ff14SB/TIP3P, side chain from CB in the blocks (BLaDE convention), H-bond constraints + HMR, 4 fs.
[prepare]
forcefield = ["amber14-all.xml"]
output = "prepared"
seed = 0
renormalize = true
solvate = true
padding = 1.0
constraints = "HBonds"
hydrogen_mass = 3.0
cutoff = 1.0

[[prepare.environment]]
file = "../mdm2_gpu/mdm2_peptide.pdb"
add_hydrogens = true
chain = "B"

[[prepare.site]]
part = 0
residue = 7
mapper = "sidechain"
variants = { ASN = "ASN_var.pdb" }

[[prepare.site]]
part = 0
residue = 8
mapper = "sidechain"
variants = { GLN = "GLN_var.pdb", MET = "MET_var.pdb" }

[[prepare.site]]
part = 0
residue = 10
mapper = "sidechain"
variants = { MET = "MET_var.pdb" }

[system]
scale_bond = false
scale_angle = false
nonbonded = "plugin"       # run_networks.sh checks the kernel and overrides this if it disagrees

[dynamics]
temperature = 300.0
timestep = 0.004
atom_friction = 1.0
platform = "CUDA"
precision = "mixed"
seed = 1

[minimize]
max_iterations = 0

[alf]
method = "published"
output = "alf"
cycles = 30                # stage 1, as the single-site MDM2 run (run_networks.sh continues to 50)
steps = 10000              # 40 ps sampled per cycle at 4 fs
equil_steps = 2500
sample_every = 10
equilibrate_steps = 25000  # 100 ps with zero biases before the first cycle

[run]
output = "run"
start = "alf"
steps = 500000             # 2 ns production per replica
equil_steps = 25000
lambda_every = 10
chunks = 5
metrics_every = 250
trajectory_every = 25000

# Network V (validation), COMPLEX leg: MDM2(25-109) + PMI peptide.
# Two sites on the peptide, 4 x 2 = 8 states, 6 of them with measured Kd (see networks.md).
#   site 1 = position 8   WT ALA (the peptide here is PMI-N8A) -> ASN (= PMI), LEU, THR
#   site 2 = position 10  WT LEU                               -> ALA (= PMI-L10A)
# Amber ff14SB/TIP3P, side chain from CB in the blocks (BLaDE convention), H-bond constraints + HMR, 4 fs.
[prepare]
forcefield = ["amber14-all.xml"]
output = "prepared"
seed = 0
renormalize = true
solvate = true
padding = 1.0
constraints = "HBonds"
hydrogen_mass = 3.0
cutoff = 1.0

[[prepare.environment]]
file = "../mdm2_gpu/mdm2_protein.pdb"
add_hydrogens = true

[[prepare.environment]]
file = "../mdm2_gpu/mdm2_peptide.pdb"
add_hydrogens = true
chain = "B"

[[prepare.site]]
part = 1
residue = 7
mapper = "sidechain"
variants = { ASN = "ASN_var.pdb", LEU = "LEU_var.pdb", THR = "THR_var.pdb" }

[[prepare.site]]
part = 1
residue = 9
mapper = "sidechain"
variants = { ALA = "ALA_var.pdb" }

[system]
scale_bond = false
scale_angle = false
nonbonded = "plugin"       # run_networks.sh checks the kernel and overrides this if it disagrees

[dynamics]
temperature = 300.0
timestep = 0.004
atom_friction = 1.0
platform = "CUDA"
precision = "mixed"
seed = 1

[minimize]
max_iterations = 0

[alf]
method = "published"
output = "alf"
cycles = 40                # stage 1 (run_networks.sh raises cycles/steps for stage 2)
steps = 10000              # 40 ps sampled per cycle at 4 fs
equil_steps = 2500
sample_every = 10
equilibrate_steps = 25000  # 100 ps with zero biases before the first cycle

[run]
output = "run"
start = "alf"
steps = 500000             # 2 ns production per replica
equil_steps = 25000
lambda_every = 10
chunks = 5
metrics_every = 250
trajectory_every = 25000
